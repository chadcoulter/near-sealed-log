[package]
name = "sealed-log"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["legacy"] }
borsh = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# near-sdk refuses to compile for a host target unless a valid cfg is set;
# `unit-testing` is the supported one and enables the pure-Rust VM fallbacks.
near-sdk = { version = "5.30.2", features = ["legacy", "unit-testing"] }

[profile.release]
opt-level = 3
